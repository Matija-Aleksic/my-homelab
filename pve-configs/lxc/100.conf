#lxc.cgroup2.devices.allow%3A c 226%3A0 rwm
#lxc.cgroup2.devices.allow%3A c 226%3A128 rwm
#lxc.mount.entry%3A /dev/dri dev/dri none bind,optional,create=dir
arch: amd64
cores: 3
dev0: /dev/dri/card1,gid=44,mode=0666
dev1: /dev/dri/renderD128,gid=993,mode=0666
features: nesting=1
hostname: APPS
memory: 10240
net0: name=eth0,bridge=vmbr0,gw=192.168.100.1,hwaddr=BC:24:11:AD:D8:35,ip=192.168.100.50/24,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-100-disk-0,size=40G
startup: order=10
swap: 512
tags: apps
timezone: Europe/Zagreb
unprivileged: 1
lxc.mount.entry: /mnt/storage mnt/storage none bind,create=dir 0 0
lxc.mount.entry: /configs mnt/configs none bind,rbind,create=dir 0 0
