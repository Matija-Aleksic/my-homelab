services:

  tailscale:

    image: tailscale/tailscale:latest

    container_name: tailscale



    hostname: edge-lxc

    restart: unless-stopped



    network_mode: host



    cap_add:

      - NET_ADMIN

      - SYS_MODULE



    devices:

      - /dev/net/tun:/dev/net/tun



    volumes:

      - ./state:/var/lib/tailscale

      - /var/lib:/var/lib



    environment:

      - TS_STATE_DIR=/var/lib/tailscale



    command: tailscaled
