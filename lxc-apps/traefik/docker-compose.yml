services:
    traefik:
        image: traefik:v3.0
        container_name: traefik
        restart: unless-stopped

        ports:
            - "80:80"
            - "8081:8080"

        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /opt/apps/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
            - /opt/apps/traefik/config:/etc/traefik/config:ro

        networks:
            - proxy

        extra_hosts:
            - "host.docker.internal:host-gateway"

networks:
    proxy:
        external: true
